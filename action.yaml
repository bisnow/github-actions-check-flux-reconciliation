name: 'Check k8s flux reconciliation'
description: 'Check if changes deployed to k8s have successfully reconciled'
inputs:
  service-name:
    description: 'Name of service being deployed(Ex: dev-biscred-api)'
    required: true
  cluster:
    description: 'k8s cluster being deployed to'
    required: true
  region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  timeout:
    description: >-
      Seconds to keep polling for the deploy SHA to reconcile before giving up.
      Raise this for services whose rollout (migrations + serial pod rollout)
      routinely runs longer than the Kustomization's own healthCheck timeout,
      which transiently reports HealthCheckFailed mid-deploy.
    required: false
    default: '300'
  dependency-timeout:
    description: >-
      Extra seconds, on top of timeout, to keep waiting while the Kustomization
      reports DependencyNotReady (another Kustomization it dependsOn, e.g.
      kyverno-policies, is not Ready yet). Time spent DependencyNotReady does
      not count against timeout, up to this many seconds. Set to 0 to disable.
    required: false
    default: '300'

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        ref: flux-main

    - name: Assume role for AWS Account
      uses: bisnow/github-actions-assume-role-for-environment@main
      with:
        aws-account: "bisnow"

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --region ${{ inputs.region }} --name ${{ inputs.cluster}}
      shell: bash

    - name: Wait for Flux reconciliation
      id: reconcile
      run: |
        echo "Waiting for Flux to reconcile the deployment..."
        timeout=${{ inputs.timeout }}
        dependency_timeout=${{ inputs.dependency-timeout }}
        interval=10
        elapsed=0
        # Seconds spent DependencyNotReady; added to the deadline, capped at
        # $dependency_timeout, so waiting on a dependency doesn't use up $timeout.
        dependency_wait=0
        # Last Flux SHA we looked up in flux-main history (see below), so we
        # fetch at most once per new revision rather than on every poll.
        checked_flux_sha=""
        echo "Poll timeout: ${timeout}s (+ up to ${dependency_timeout}s while DependencyNotReady)"

        echo "waiting for 60 seconds before checking for Flux reconciliation to help prevent false negitives"
        sleep 60

        # Get current git SHA from flux-main branch (export for summary)
        current_git_sha=$(git rev-parse HEAD)
        echo "EXPECTED_SHA=$current_git_sha" >> $GITHUB_ENV

        while [ $elapsed -lt $((timeout + dependency_wait)) ]; do
          # Fetch status/reason/revision/message in a single snapshot to avoid
          # races where state changes between separate kubectl calls. The
          # message goes last and `read` takes only the first line, so a
          # multi-line or '|'-containing message can't shift the other fields.
          ready_json=$(kubectl get kustomization ${{ inputs.service-name }} -n flux-system -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}|{.status.conditions[?(@.type=="Ready")].reason}|{.status.lastAppliedRevision}|{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || echo "Unknown|Unknown|Unknown|")
          IFS='|' read -r status reason flux_revision ready_message <<< "$ready_json"
          flux_sha=$(echo "$flux_revision" | sed 's/.*@sha1://')
          [ -z "$status" ] && status="Unknown"
          [ -z "$reason" ] && reason="Unknown"

          echo "Current git SHA: $current_git_sha"
          echo "Flux revision: $flux_revision"
          echo "Flux SHA: $flux_sha"
          echo "Ready status: $status (reason: $reason)"

          # Export for summary
          echo "FLUX_SHA=$flux_sha" >> $GITHUB_ENV
          echo "ELAPSED=${elapsed}s" >> $GITHUB_ENV

          # Success path: SHA matches AND last reconcile succeeded.
          # We check reason rather than just status=True because Ready can
          # momentarily flip to False mid-reconcile even on a healthy deploy.
          if [ "$flux_sha" = "$current_git_sha" ] && [ "$reason" = "ReconciliationSucceeded" ]; then
            echo "✅ Flux reconciliation successful! SHA matches: $current_git_sha"
            kubectl get kustomization ${{ inputs.service-name }} -n flux-system
            echo "RECONCILE_STATUS=success" >> $GITHUB_ENV
            exit 0
          fi

          # Overtaken by a newer commit: another deploy can land on flux-main
          # right after ours, and Flux then applies that newer commit instead,
          # so the exact SHA match above never happens. If the applied revision
          # has ours in its history, our change is live. The checkout is
          # shallow, so fetch more flux-main history when the applied SHA isn't
          # local yet; do this once per new Flux SHA, not on every poll.
          if [ "$reason" = "ReconciliationSucceeded" ] && [ "$flux_sha" != "$current_git_sha" ] && [ "$flux_sha" != "$checked_flux_sha" ] && [[ "$flux_sha" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            if git cat-file -e "${flux_sha}^{commit}" 2>/dev/null || git fetch -q --deepen=50 origin flux-main; then
              checked_flux_sha=$flux_sha
              if ! git cat-file -e "${flux_sha}^{commit}" 2>/dev/null; then
                echo "Flux SHA $flux_sha is not in the fetched flux-main history; continuing to wait for $current_git_sha"
              elif git merge-base --is-ancestor "$current_git_sha" "$flux_sha"; then
                echo "✅ Flux reconciliation successful! Flux applied a newer revision $flux_sha that contains $current_git_sha"
                kubectl get kustomization ${{ inputs.service-name }} -n flux-system
                echo "RECONCILE_STATUS=success" >> "$GITHUB_ENV"
                echo "reconciled-via=newer-revision" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "Flux SHA $flux_sha does not contain $current_git_sha; continuing to wait"
              fi
            else
              echo "⚠️ Could not fetch flux-main history to check $flux_sha; will retry on the next poll"
            fi
          fi

          # DependencyNotReady: a Kustomization we dependsOn (e.g. kyverno-policies)
          # isn't Ready, so ours hasn't started. Don't let that wait use up
          # $timeout: push the deadline out by the time spent here, capped at
          # $dependency_timeout in total.
          if [ "$reason" = "DependencyNotReady" ]; then
            dependency_message=$ready_message
            dependency_wait=$((dependency_wait + interval))
            [ $dependency_wait -gt $dependency_timeout ] && dependency_wait=$dependency_timeout
            echo "Waiting on dependency: ${ready_message} (${dependency_wait}s of ${dependency_timeout}s dependency allowance used)"
          fi

          if [ "$status" = "True" ]; then
            echo "⏳ Flux ready but using different SHA. Waiting for SHA to match... (${elapsed}s elapsed)"
          elif [ "$status" = "False" ]; then
            # HealthCheckFailed is transient during a normal deploy: Flux's
            # Kustomization gives up its own healthCheck (typically 2m) while the
            # HelmRelease is still rolling (migrations + serial pod rollout), then
            # retries and recovers on its next reconcile. Wait it out within our
            # own $timeout rather than failing the deploy on that false negative.
            # A genuinely broken deploy stays HealthCheckFailed and is caught when
            # $timeout expires below. Other reasons (e.g. apply/build errors) are
            # terminal and still fail fast.
            if [ "$reason" = "DependencyNotReady" ] || [ "$reason" = "Progressing" ] || [ "$reason" = "ReconciliationSucceeded" ] || [ "$reason" = "HealthCheckFailed" ]; then
              echo "⏳ Not ready yet ($reason), continuing to wait... (${elapsed}s elapsed)"
            else
              echo "❌ Flux reconciliation failed! Reason: $reason"
              error_output=$(kubectl describe kustomization "${{ inputs.service-name }}" -n flux-system 2>&1)
              echo "$error_output"
              echo "RECONCILE_STATUS=failed" >> $GITHUB_ENV
              echo "ERROR_OUTPUT<<EOF" >> $GITHUB_ENV
              echo "$error_output" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              exit 1
            fi
          else
            echo "⏳ Flux still reconciling... (${elapsed}s elapsed)"
          fi

          sleep $interval
          elapsed=$((elapsed + interval))
        done

        if [ "${reason:-}" = "DependencyNotReady" ]; then
          # e.g. "dependency 'flux-system/kyverno-policies' is not ready"
          dependency=$(echo "$dependency_message" | sed -n "s/.*dependency '\([^']*\)'.*/\1/p")
          [ -z "$dependency" ] && dependency=${dependency_message:-unknown}
          echo "⏰ Timeout waiting for Flux reconciliation: held up by dependency ${dependency}, still not ready after ${elapsed}s (${dependency_wait}s past the ${timeout}s timeout). Message: ${dependency_message}"
          echo "blocked-by=$dependency" >> "$GITHUB_OUTPUT"
        else
          echo "⏰ Timeout waiting for Flux reconciliation"
        fi
        error_output=$(kubectl describe kustomization ${{ inputs.service-name }} -n flux-system 2>&1)
        echo "$error_output"
        echo "RECONCILE_STATUS=timeout" >> $GITHUB_ENV
        echo "ERROR_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$error_output" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        exit 1
      shell: bash

    - name: Write job summary
      if: always()
      shell: bash
      env:
        RECONCILED_VIA: ${{ steps.reconcile.outputs.reconciled-via }}
        BLOCKED_BY: ${{ steps.reconcile.outputs.blocked-by }}
      run: |
        if [ "${{ steps.reconcile.outcome }}" = "success" ]; then
          STATUS_TEXT="Reconciled"
          if [ "$RECONCILED_VIA" = "newer-revision" ]; then
            STATUS_TEXT="Reconciled (Flux applied a newer flux-main revision that contains the expected SHA)"
          fi
        elif [ "$RECONCILE_STATUS" = "timeout" ]; then
          STATUS_TEXT="Timeout"
          if [ -n "$BLOCKED_BY" ]; then
            STATUS_TEXT="Timeout (dependency \`${BLOCKED_BY}\` not ready)"
          fi
        else
          STATUS_TEXT="Failed"
        fi

        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## Flux Reconciliation

        | Field | Value |
        |-------|-------|
        | Service | \`${{ inputs.service-name }}\` |
        | Cluster | \`${{ inputs.cluster }}\` |
        | Expected SHA | \`${EXPECTED_SHA:-unknown}\` |
        | Flux SHA | \`${FLUX_SHA:-unknown}\` |
        | Duration | \`${ELAPSED:-unknown}\` |
        | Status | ${STATUS_TEXT} |
        EOF

        if [ "${{ steps.reconcile.outcome }}" != "success" ] && [ -n "$ERROR_OUTPUT" ]; then
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'

        <details>
        <summary>Kustomization Details</summary>

        ```
        EOF
          echo "$ERROR_OUTPUT" >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ```

        </details>
        EOF
        fi

